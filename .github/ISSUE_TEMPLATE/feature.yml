name: Feature request
description: Ask for something glowup does not do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What you would like glowup to do. A sketch of the screen is fine.
